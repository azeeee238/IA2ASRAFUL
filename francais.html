<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Léa - Ton IA de Français</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 400px;
            height: 600px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .chat-header {
            background: #8b5cf6;
            color: white;
            padding: 16px;
            text-align: center;
            font-weight: bold;
            font-size: 1.1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .back-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.8rem;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .message.bot { background: #334155; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 2px; }
        .message.user { background: #8b5cf6; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #0f172a;
            border-top: 1px solid #334155;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            background: #1e293b;
            border: 1px solid #475569;
            border-radius: 8px;
            color: white;
            outline: none;
            font-size: 0.95rem;
        }
        .chat-input-area button {
            background: #8b5cf6;
            color: white;
            border: none;
            padding: 0 16px;
            margin-left: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <span>📚 Léa - Français</span>
            <a href="index.html" class="back-btn">Menu 🏠</a>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot">Coucou ! C'est Léa version Français. Envoie-moi un verbe à conjuguer (imparfait, passé simple) ou une règle d'accord !</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Écris ta question de français..." autofocus>
            <button onclick="envoyerMessage()">Envoyer</button>
        </div>
    </div>

    <script>
        const inputField = document.getElementById("userInput");
        const messagesContainer = document.getElementById("chatMessages");
        inputField.addEventListener("keypress", (e) => { if (e.key === "Enter") envoyerMessage(); });

        function ajouterMessage(texte, expediteur) {
            const div = document.createElement("div");
            div.classList.add("message", expediteur);
            div.textContent = texte;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function repondre(texte) {
            const t = texte.toLowerCase();
            if (t.includes("imparfait")) return "À l'imparfait, les terminaisons du 1er groupe sont : -ais, -ais, -ait, -ions, -iez, -aient.";
            if (t.includes("passe simple") || t.includes("passé simple")) return "Au passé simple (-er) : -ai, -as, -a, -âmes, -âtes, -èrent.";
            if (t.includes("accord") || t.includes("participe")) return "Avec 'être', le participe s'accorde avec le sujet. Avec 'avoir', non (sauf COD avant) !";
            return "Tu veux bosser l'imparfait, le passé simple ou les règles d'accord ? Dis-moi tout !";
        }

        function envoyerMessage() {
            const texte = inputField.value.trim();
            if (!texte) return;
            ajouterMessage(texte, "user");
            inputField.value = "";
            setTimeout(() => ajouterMessage(repondre(texte), "bot"), 400);
        }
    </script>
</body>
</html>
